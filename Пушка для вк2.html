<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202124"><title>Пушка. Включайся.</title>
<style>
:root{--bg:#202124;--panel:#2c2d30;--lime:#39ff14;--pink:#ff00a8;--yellow:#ffeb00;--blue:#16a9ff;--white:#f7f7f7;--muted:#b7b7bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}
.top{padding:18px clamp(18px,5vw,70px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444}
.logo{font-weight:1000;letter-spacing:-1.5px;line-height:.86;font-size:clamp(22px,3vw,35px);color:var(--lime);text-transform:uppercase}.logo span{display:block}.tag{font-size:11px;color:#ddd;max-width:130px;text-align:right;line-height:1.3}
.wrap{max-width:900px;margin:auto;padding:26px 20px 55px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--pink);font-weight:800}
h1{font-size:clamp(38px,8vw,76px);line-height:.93;letter-spacing:-3px;margin:16px 0 20px;text-transform:uppercase}h1 em{font-style:normal;color:var(--lime)}p{line-height:1.55;color:#dedee2}
.hero{padding:clamp(20px,5vw,50px);background:var(--pink);color:#1e1e20;border-radius:22px;position:relative;overflow:hidden}.hero p{color:#242428;max-width:550px;font-weight:600}.hero h1 em{color:#fff}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:800;min-height:48px;transition:transform .12s,opacity .12s}.btn:active{transform:scale(.98)}.primary{background:var(--lime);color:#151515}.secondary{background:transparent;border:1px solid #777;color:white}.pink{background:var(--pink);color:#161616}.btn:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.footnote{font-size:12px;color:var(--muted);margin-top:22px}
.progressrow{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;color:#d8d8dc;margin-bottom:10px}.progress{height:8px;background:#414247;border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--lime);width:0;transition:width .25s}
.panel{background:var(--panel);border:1px solid #48494e;border-radius:22px;padding:clamp(20px,4vw,36px);margin-top:20px}
.stephead{display:flex;gap:12px;align-items:flex-start}.num{font-size:13px;font-weight:900;color:#111;background:var(--yellow);padding:8px 10px;border-radius:8px;white-space:nowrap}
h2{font-size:clamp(25px,5vw,40px);letter-spacing:-1.2px;line-height:1.05;margin:4px 0 12px} .sub{font-size:14px;color:#c8c8ce;margin:0 0 22px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{display:flex;align-items:flex-start;gap:11px;text-align:left;background:#38393d;color:white;border:1px solid #5b5c61;border-radius:13px;padding:15px;min-height:65px;line-height:1.35}.option .mark{width:20px;height:20px;border:2px solid #aaa;border-radius:5px;flex:0 0 20px;margin-top:1px;display:grid;place-items:center;font-size:13px;font-weight:bold}.option.selected{border:2px solid var(--lime);background:#263c28;padding:14px}.option.selected .mark{background:var(--lime);border-color:var(--lime);color:#111}.single .option .mark{border-radius:50%}
.showmore{margin:14px 0 4px;background:transparent;border:0;color:var(--lime);font-weight:800;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.custom{margin-top:20px;padding-top:18px;border-top:1px solid #505156}.custom label,.fieldlabel{display:block;font-size:13px;font-weight:800;margin-bottom:9px}.custom .option{display:inline-flex;width:auto;min-height:0;padding:10px 13px}.custom input,.field,.custom textarea{width:100%;border-radius:11px;border:1px solid #66676c;background:#202124;color:#fff;padding:14px;outline:none}.custom input:focus,.field:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 2px #39ff1433}.custom input{margin-top:10px}
.footeractions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.small{font-size:12px;color:#bfc0c6}.notice{background:#343538;border-left:3px solid var(--yellow);padding:12px 14px;border-radius:6px;font-size:12px;color:#ddd;margin-top:18px}
.field{display:block;margin:12px 0 15px;font-size:16px}.genrow{display:flex;gap:10px;flex-wrap:wrap}.genrow .field{flex:1;min-width:180px}
.pushka-cta{max-width:700px;margin:28px auto 10px;padding:24px 20px;text-align:center;border:1px solid #ff00a8;border-radius:18px;background:#29292d}.pushka-cta p{font-size:clamp(16px,3.8vw,20px);line-height:1.5;margin:0 auto 18px;max-width:560px}.pushka-cta strong{color:var(--lime)}.pushka-cta .pushka-cta-main{font-size:clamp(14px,3vw,17px);font-weight:600;color:#dedee2;line-height:1.45;margin-bottom:18px}.pushka-cta .pushka-cta-bottom{font-size:15px;margin:18px auto 0;color:var(--lime)}.pushka-cta .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;max-width:100%}.survey-cta{max-width:560px;margin:18px auto 8px;padding:0;text-align:center;border:0;border-radius:0;background:transparent}.survey-cta p{font-size:14px;line-height:1.45;margin:0 auto 10px;color:#a9a9b1}.survey-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:32px;padding:5px 8px;font-size:12px;color:#a9a9b1;background:transparent;border:0;border-radius:0;box-shadow:none;opacity:.82}.survey-link:hover{color:#dedee2;opacity:1}
.passport{background:#f5f5f0;color:#171719;border-radius:18px;overflow:hidden;max-width:700px;margin:22px auto 0;box-shadow:0 18px 50px #0005}.passhead{background:var(--pink);padding:26px}.passbrand{font-size:12px;letter-spacing:2px;font-weight:900}.passhead h2{font-size:clamp(30px,7vw,55px);text-transform:uppercase;margin:16px 0 0;overflow-wrap:anywhere}.passbody{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:0}.passitem{padding:13px 10px;border-bottom:1px solid #d2d2cc;min-width:0}.passitem:nth-child(odd){border-right:1px solid #d2d2cc}.passitem b{display:block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#666;margin-bottom:7px}.passitem span{font-size:15px;font-weight:700;overflow-wrap:anywhere}.passbottom{background:#202124;color:var(--lime);padding:16px 22px;font-size:12px;font-weight:800;letter-spacing:1px}
.logo-stage{background:#f5f5f0;border-radius:16px;min-height:210px;display:grid;place-items:center;margin:5px 0 16px;overflow:hidden}.logo-stage svg{width:min(100%,340px);height:auto}.logo-placeholder{text-align:center;color:#202124;font-size:28px;font-weight:1000;letter-spacing:2px}.logo-placeholder span{font-size:11px;letter-spacing:4px;color:#ff00a8}.option .option-copy{display:flex;flex-direction:column;gap:5px}.option .option-title{font-weight:900;text-transform:uppercase;letter-spacing:.2px}.option .option-desc{font-size:12px;color:#c9c9cf;line-height:1.35;font-weight:400}.option.selected .option-desc{color:#e4f4e3}.passhead{background:var(--pink);padding:26px;position:relative}.passport-logo{max-width:180px;margin-top:14px}.passport-logo svg{width:100%;height:auto;border-radius:10px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0005;z-index:5;max-width:90vw;font-size:13px}
dialog{background:#303135;color:white;border:1px solid #666;border-radius:18px;padding:25px;max-width:90vw}dialog::backdrop{background:#0009}.hidden{display:none!important}
@media(max-width:600px){.options{grid-template-columns:1fr}.top{padding:16px 20px}.tag{max-width:105px}.wrap{padding:20px 14px 40px}.hero{border-radius:16px}.panel{border-radius:16px}.passbody{padding:12px}.passitem{padding:12px 8px}.btn{flex:1}.footeractions .btn{min-width:110px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header class="top"><div class="logo"><span>Пушка.</span><span>Включайся.</span></div><div class="tag">КОНСТРУКТОР<br>ТВОЕГО МЕРОПРИЯТИЯ</div></header>
<main class="wrap" id="app"></main>
<dialog id="confirm"><h2 id="confirmTitle">Начать заново?</h2><p id="confirmText">Черновик будет очищен.</p><div class="actions"><button class="btn secondary" id="cancelReset">Отмена</button><button class="btn primary" id="confirmReset">Очистить и начать</button></div></dialog>
<script>
const blocks=[
{key:'format',title:'Выбери, в каком формате ты хочешь собрать событие',hint:'Один ответ',type:'single',opts:[
'Квиз – отвечать на вопросы командой и делать это быстрее всех','Выставка – смотреть на экспонаты и ходить по зонам','Игровой турнир – играть и соревноваться','Разговор / дискуссия / дебаты – обсуждать тему и спорить с ведущим','Кинопоказ – смотреть фильм и потом обсуждать впечатления','Перформанс / спектакль – смотреть действие с актёрами и зрителями','Мафия, Dungeons & Dragons и игротека – играть роль и разыгрывать историю с другими','Стендап – слушать шутки и смеяться вместе с живой аудиторией','Квест, иммерсивный театр – проходить задания и погружаться в историю','Мини-фестиваль – попробовать несколько активностей в одном месте','Квартирник – устроить концерт в домашней обстановке','Мастер-класс – что-то сделать руками','Экскурсия / прогулка по городу – ходить по местам и узнавать новое'],custom:'А может, твой вариант? Напиши формат сам',customLabel:'Свой формат'},
{key:'theme',title:'Выбери тему или напиши свою',hint:'Можно выбрать несколько',type:'multi',opts:[
'Косплей и реконструкция – костюмы и образы','Компьютерные игры и киберспорт — игры, турниры и соревнования','Литература и сценарии — книги, сюжеты и истории','Музыка — жанры, исполнители и звук','Кино — фильмы, сериалы и их обсуждение','История и город – дворы, подъезды и панельки','Городские легенды и крипипаста – страшилки района и интернета','Фандомы и фанфики – вселенные, сюжеты и фанатское творчество','Рукоделие и кастомизация – самодельные вещи и переделка под себя','Мемы и интернет-культура – шутки, фольклор и язык поколения','Нейросети и промты – ИИ, генерации и границы возможного','Математические парадоксы – странные задачи и невозможные числа','Сторителлинг и сценарии – сюжеты, структура и истории'],custom:'Своё – твой ход, напиши тему, которая тебе заходит',customLabel:'Своя тема'},
{key:'vibe',title:'Какой должен быть вайб?',hint:'Можно выбрать несколько',type:'multi',opts:['Хаотично и непредсказуемо','Ностальгично','Футуристично','Интеллектуально и с вызовом','Абсурдно и смешно','Чиллово и расслаблено','Смело и экспериментально','Жутко и захватывающе','Энергично и на движе','Душевно и искренне','Соревновательно и азартно','Сказочно и волшебно'],custom:'Свой вайб – придумай ощущение сам',customLabel:'Свой вайб'},
{key:'place',title:'Где это может пройти?',hint:'Можно выбрать несколько',type:'multi',opts:['Большой зал','Танцевальный зал «Селена»','Литературный сквер','Набережная','Чердак','Твоя школа','Двор','Фонтан «Енисей и Кан»','Кинотеатр','Антикино / малый зал','Закулисье ДК'],custom:'Своё место – не нашёл подходящего? Впиши свою локацию',customLabel:'Своя локация'},
{key:'feature',title:'Придумай деталь, которая цепляет. Что запомнится?',hint:'Можно выбрать несколько',type:'multi',opts:['Единый визуальный код – один цвет во всём','Секретное правило – все узнают его на входе','Артефакт на память – маленький предмет, который уносят все','Пасхалка – скрытая деталь для самых внимательных','Тайный участник – человек с особой ролью без объявления','Звуковая подпись – джингл или мелодия события','Общий объект – все что-то добавляют в одну вещь','Скрытый таймер – что-то меняется в последний момент','Общий плейлист – музыка, которую добавляют сами участники','Стена признаний – анонимные благодарности и комплименты'],custom:'Своя фишка – придумай деталь сам',customLabel:'Своя фишка'},
{key:'budget',title:'Бюджет из Пушки',hint:'Сколько из 5000 ₽ ты готов вложить в своё мероприятие? Можно пропустить.',type:'single',optional:true,opts:['До 250 ₽','До 500 ₽','До 1500 ₽','До 3000 ₽']},
{key:'name',title:'Хочешь дать название?',hint:'Название можно придумать самому или поручить конструктору.',type:'name',optional:false},
{key:'logo',title:'Сгенерим узнаваемый логотип?',hint:'Создай визуальный знак для своей идеи. Можно пропустить этот шаг.',type:'logo',optional:true}
];
const STORAGE='pushka-builder-draft-v1';
let state={step:0,answers:{},custom:{},expanded:{},visible:{},showMoreUsed:false,startedAt:new Date().toISOString(),completed:false,started:false,ageDone:false,ageGroup:'',preSurveyDone:false,preSurvey:{status:'',noReason:'',noOther:'',barriers:[],barrierOther:''},logoSeed:0,logoGenerated:false};
let toastTimer;
function load(){try{const x=localStorage.getItem(STORAGE);if(x){const d=JSON.parse(x);if(d&&d.answers)state={...state,...d};}}catch(e){notify('Автосохранение недоступно. Можно продолжать, но черновик может не сохраниться.');}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){notify('Не удалось сохранить черновик. Прохождение продолжается без сохранения.');}}
function notify(t){let el=document.querySelector('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3500)}
function selected(key,v){const a=state.answers[key];return Array.isArray(a)?a.includes(v):a===v}
function setSelected(b,v){if(b.type==='single')state.answers[b.key]=v;else{let a=state.answers[b.key]||[];state.answers[b.key]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}save();render()}
function customActive(b){return !!(state.custom[b.key]&&state.custom[b.key].active)}
function valid(b){if(b.optional)return true;if(b.type==='name')return !!(state.answers.name||'').trim();if(b.type==='email'||b.type==='idea')return true;let a=state.answers[b.key];let has=Array.isArray(a)?a.length>0:!!a;return has||!!(customActive(b)&&(state.custom[b.key].text||'').trim())}
function textAnswer(b){const a=state.answers[b.key];let vals=Array.isArray(a)?a:(a?[a]:[]);if(customActive(b)&&(state.custom[b.key].text||'').trim())vals.push(state.custom[b.key].text.trim());return vals.join('; ')||'не выбран'}
function randomSix(b){let all=[...b.opts];for(let i=all.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}return all.slice(0,6)}
function initialVisible(b){if(state.expanded[b.key])return b.opts;let chosen=state.answers[b.key];let arr=Array.isArray(chosen)?chosen:(chosen?[chosen]:[]);let visible=state.visible&&state.visible[b.key];if(visible)return visible;let six=randomSix(b);for(const c of arr)if(!six.includes(c)&&b.opts.includes(c))six[Math.floor(Math.random()*six.length)]=c;state.visible=state.visible||{};state.visible[b.key]=six;return six}
function render(){const root=document.getElementById('app');if(state.completed){renderPassport(root);return}if(!state.started){renderIntro(root);return}if(!state.ageDone){renderAgeGate(root);return}if(state.ageGroup==='14-18'||state.ageGroup==='18-22'){if(!state.preSurveyDone){renderPreSurvey(root);return}}if(state.step<0)state.step=0;if(state.step>=blocks.length)state.step=blocks.length-1;
if(state.step===-1){return}
const b=blocks[state.step],idx=state.step+1,total=blocks.length,pct=(idx/total)*100;
let out=`<div class="progressrow"><span>Блок ${idx} из ${total}</span><span>${Math.round(pct)}%</span></div><div class="progress" role="progressbar" aria-valuenow="${idx}" aria-valuemin="1" aria-valuemax="${total}"><div class="bar" style="width:${pct}%"></div></div><section class="panel"><div class="stephead"><div class="num">0${idx}</div><div><h2>${b.title}</h2><p class="sub">${b.hint||''}</p></div></div>`;
if(b.opts){const visible=initialVisible(b);out+=`<div class="options ${b.type==='single'?'single':''}" role="group" aria-label="${b.title}">`;visible.forEach((v)=>{out+=optionHTML(b,v)});out+='</div>';if(!state.expanded[b.key]&&b.opts.length>6)out+=`<button class="showmore" id="more">＋ Показать ещё ${b.opts.length-6} вариантов</button>`;if(b.custom){out+=`<div class="custom"><label>${b.custom}</label><button class="option ${customActive(b)?'selected':''}" id="customToggle" aria-pressed="${customActive(b)}"><span class="mark">${customActive(b)?'✓':'+'}</span>${b.customLabel}</button>${customActive(b)?`<input id="customText" value="${escapeAttr(state.custom[b.key]?.text||'')}" placeholder="Напиши свой вариант…" aria-label="${b.customLabel}">`:''}</div>`}}
if(b.key==='logo'){out+=`<div class="logo-stage">${state.logoGenerated?logoSVG():'<div class="logo-placeholder">ТВОЯ ИДЕЯ<br><span>ЖДЁТ СВОЙ ЗНАК</span></div>'}</div><button class="btn pink" id="makeLogo">✦ Сгенерировать логотип</button><p class="small">Каждое нажатие создаёт новый вариант. Логотип попадёт на паспорт.</p>`}
if(b.key==='name'){out+=`<label class="fieldlabel" for="eventName">Название мероприятия</label><div class="genrow"><input class="field" id="eventName" maxlength="100" placeholder="Например, Ночь странных историй" value="${escapeAttr(state.answers.name||'')}"><button class="btn pink" id="generate">Придумать за меня</button></div>`}
if(b.key==='email'){out+=`<label class="fieldlabel" for="email">Электронная почта (необязательно)</label><input class="field" id="email" type="email" placeholder="name@example.com" value="${escapeAttr(state.answers.email||'')}"><p class="small">Почта нужна только для связи, если ты хочешь участвовать в реализации идеи. Она не влияет на анонимность остальных ответов и не должна передаваться третьим лицам.</p>`}
if(b.key==='idea'){out+=`<label class="fieldlabel" for="idea">Опиши свою идею</label><textarea class="field" id="idea" rows="5" maxlength="2000" placeholder="Что должно происходить? Что сделает событие особенным?">${escapeHTML(state.answers.idea||'')}</textarea><p class="small">Ответы используются для отбора идей и создания мероприятий.</p>`}
out+=`<div class="notice">Ответы используются для отбора идей и создания мероприятий. Основные ответы сохраняются без привязки к имени.</div><div class="footeractions"><button class="btn secondary" id="back" ${idx===1?'disabled':''}>← Назад</button><div class="actions" style="margin:0">`;if(b.key==='email'){out+=`<button class="btn secondary" id="skip">Пропустить</button><button class="btn primary" id="next">Далее →</button>`}else if(b.key!=='idea'&&b.optional){out+=`<button class="btn secondary" id="skip">Пропустить</button>`}if(b.key!=='email')out+=`<button class="btn primary" id="next" ${valid(b)?'':'disabled'}>${b.key==='idea'?'Хочу увидеть свою Пушку':'Далее →'}</button>`;out+=`</div></div></section><div class="footnote">«Пушка. Включайся.» · Зеленогорский городской Дворец культуры</div>`;
root.innerHTML=out;wire(b)}

function renderAgeGate(root){
 const ageOpts=['Старше 22','18–22 года','14–18 лет','Младше 14'];
 const values=['over22','18-22','14-18','under14'];
 let out=`<div class="eyebrow">Перед стартом</div><h1>Сначала <em>возраст.</em></h1><p>Сколько тебе лет?</p><section class="panel"><div class="stephead"><div class="num">01</div><div><h2>Выбери свой возраст</h2><p class="sub">Один ответ</p></div></div><div class="options single" id="ageOptions">`;
 ageOpts.forEach((v,i)=>{const on=state.ageGroup===values[i];out+=`<button class="option ${on?'selected':''}" data-age="${values[i]}" aria-pressed="${on}"><span class="mark">${on?'✓':''}</span><span class="option-copy"><span class="option-title">${v}</span></span></button>`});
 out+=`</div><div class="footeractions" style="justify-content:flex-end"><button class="btn primary" id="ageNext" ${state.ageGroup?'':'disabled'}>Далее →</button></div></section><div class="footnote">«Пушка. Включайся.» · Зеленогорский городской Дворец культуры</div>`;
 root.innerHTML=out;
 document.querySelectorAll('[data-age]').forEach(el=>el.onclick=()=>{
   if(state.ageGroup!==el.dataset.age){
     state.preSurveyDone=false;

    formData.append('name', state.answers.name || '');
    formData.append('format', textAnswer(blocks[0]));
    formData.append('theme', textAnswer(blocks[1]));
    formData.append('vibe', textAnswer(blocks[2]));
    formData.append('place', textAnswer(blocks[3]));
    formData.append('feature', textAnswer(blocks[4]));
    formData.append('budget', state.answers.budget || 'не выбран');
    formData.append('custom', JSON.stringify(state.custom));
    formData.append('show_more_used', !!state.showMoreUsed);
    formData.append('age_group', state.ageGroup || '');
    formData.append('pushkin_card_status', state.preSurvey?.status || '');
    formData.append('pushkin_card_no_reason', state.preSurvey?.noReason || '');
    formData.append('pushkin_card_no_other', state.preSurvey?.noOther || '');
    formData.append('pushkin_card_barriers', JSON.stringify(state.preSurvey?.barriers || []));
    formData.append('pushkin_card_barrier_other', state.preSurvey?.barrierOther || '');

    fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.result === 'success') {
            console.log('Данные успешно отправлены в Google Таблицу!');
        } else {
            console.error('Ошибка на стороне Google:', data.error);
        }
    })
    .catch(error => {
        console.error('Ошибка отправки:', error);
    });
}
